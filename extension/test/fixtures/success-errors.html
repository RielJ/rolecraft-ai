<!doctype html>
<html lang="en">
  <body>
    <main>
      <h1>Apply for Backend Engineer</h1>
      <div role="alert">Please fix the errors below before submitting.</div>
      <form>
        <label for="name">Name</label><input id="name" name="name" value="Ada" />
        <label for="email">Email</label>
        <input id="email" type="email" name="email" aria-invalid="true" />
        <span class="field-error">Email can't be blank</span>
        <label for="resume">Resume</label><input id="resume" type="file" name="resume" />
        <button type="submit">Submit application</button>
      </form>
    </main>
  </body>
</html>
